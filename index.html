<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WasherBox Brotherhood — Season 6 Championships</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a1f; font-family: 'Oswald', sans-serif; color: #e8e0cc; overflow-x: hidden; }
    :root {
      --charcoal: #1a1a1f;
      --charcoal-2: #222228;
      --charcoal-3: #2c2c34;
      --charcoal-4: #383843;
      --cream: #e8e0cc;
      --cream-dim: #b8b09c;
      --gold: #c8a84b;
      --gold-light: #e2c97e;
      --gold-dark: #8a6f28;
      --gold-glow: rgba(200,168,75,0.25);
      --red-accent: #8b2a2a;
      --border: rgba(200,168,75,0.2);
      --border-bright: rgba(200,168,75,0.5);
    }
    scrollbar-width: thin;
    scrollbar-color: var(--gold-dark) var(--charcoal-2);
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
